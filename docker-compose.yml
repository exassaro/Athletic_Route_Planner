# Services. Valhalla, GraphHopper, Postgres and Redis start by default; Photon sits
# under the `geocode` profile so it only uses RAM when asked for.
services:
  valhalla:
    # Pinned by digest (was :latest on 2026-11-16, Valhalla 3.9.2) so the engine
    # cannot change under the measurements.
    image: ghcr.io/valhalla/valhalla-scripted@sha256:6e3a8a6deb570f111ab628826f0ffc5c59ea428d3c578d303dce07638c180843
    container_name: athlete-valhalla
    ports:
      - "8002:8002"
    volumes:
      # Tiles, elevation and valhalla.json are written here (gitignored).
      - ./data/valhalla:/custom_files
      # The pinned extract from engine/scripts/fetch_extract.py, read-only.
      - ./data/osm/kerala.osm.pbf:/custom_files/kerala.osm.pbf:ro
    environment:
      - use_tiles_ignore_pbf=True   # reuse built tiles on restart
      - force_rebuild=False
      - build_elevation=True        # download DEM tiles for the graph's bbox
      - build_admins=False          # not needed for pedestrian routing in one country
      - build_time_zones=False      # no time-dependent routing in Phase 2
      - build_tar=True
      - serve_tiles=True
      - server_threads=2            # 8 GB laptop
    restart: "no"

  # Geocoder. Started only on request:  docker compose --profile geocode up -d photon
  photon:
    profiles: ["geocode"]
    build:
      context: ./engine/photon
    image: athlete-photon:1.3.0
    container_name: athlete-photon
    ports:
      - "2322:2322"
    volumes:
      # Prebuilt India index from engine/scripts/fetch_photon.py (gitignored).
      - ./data/photon:/photon
    environment:
      - JAVA_OPTS=-Xmx1500m
    mem_limit: 3g
    restart: "no"

  # GraphHopper: the route generator for the "recommended" alternative (Phase 3 amendment 1), on the same
  # pinned extract as Valhalla. Profile foot_rules plus the Phase 3 spike profiles (foot_direct, foot_quiet).
  # First start imports Kerala (about 3 minutes, about 2 GB RAM); delete data/graphhopper/graph-cache to re-import.
  #   docker compose up -d valhalla graphhopper
  graphhopper:
    build:
      context: ./engine/graphhopper
    image: athlete-graphhopper:11.1
    container_name: athlete-graphhopper
    ports:
      - "8989:8989"
    volumes:
      - ./data/graphhopper:/data
      - ./data/osm/kerala.osm.pbf:/osm/kerala.osm.pbf:ro
    environment:
      - JAVA_OPTS=-Xmx3g
    mem_limit: 4g
    restart: "no"

  # Phase 4: the API's database (plans, versions, routes, saved routes). PostgreSQL 16.4 + PostGIS 3.4,
  # pinned by digest (postgis/postgis:16-3.4 on 2026-11-18). Development credentials only.
  #   docker compose up -d postgres redis
  postgres:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: athlete-postgres
    ports:
      - "5433:5432"   # 5433 on the host: a native Windows PostgreSQL already listens on 5432
    environment:
      - POSTGRES_USER=athlete
      - POSTGRES_PASSWORD=athlete
      - POSTGRES_DB=athlete
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    # The API waits for this: started too early, it gets "connection refused" and exits.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athlete -d athlete"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: "no"

  # Phase 4: solve cache (24 h), rate-limit counters. Redis 7.4.12, pinned by digest (redis:7.4-alpine on
  # 2026-11-18). Nothing in it needs to survive a restart, so persistence is off.
  redis:
    image: redis@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: athlete-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 320m
    restart: "no"

  # Phase 4: the API (FastAPI over the solver). Started only on request:
  #   docker compose --profile api up -d --build api
  # Runs migrations on start. One worker (amendment 20). Rate limits can be raised for load measurements with
  # the ATHLETE_RATE_* variables (defaults: amendment 22).
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: api/Dockerfile
    image: athlete-api:0.4.0
    container_name: athlete-api
    ports:
      - "8000:8000"
    environment:
      - VALHALLA_URL=http://valhalla:8002
      - GRAPHHOPPER_URL=http://graphhopper:8989
      - ATHLETE_PHOTON_URL=http://photon:2322
      - ATHLETE_DATABASE_URL=postgresql+asyncpg://athlete:athlete@postgres:5432/athlete
      - ATHLETE_REDIS_URL=redis://redis:6379/0
      - ATHLETE_RATE_SOLVE_PER_CLIENT_MIN=${ATHLETE_RATE_SOLVE_PER_CLIENT_MIN:-20}
      - ATHLETE_RATE_SOLVE_PER_IP_MIN=${ATHLETE_RATE_SOLVE_PER_IP_MIN:-40}
      - ATHLETE_RATE_READ_PER_CLIENT_MIN=${ATHLETE_RATE_READ_PER_CLIENT_MIN:-300}
      - ATHLETE_RATE_SESSION_PER_IP_HOUR=${ATHLETE_RATE_SESSION_PER_IP_HOUR:-10}
      - ATHLETE_CORS_ORIGINS=${ATHLETE_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data/manifest.json:/app/data/manifest.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 1g
    restart: "no"

  # Phase 5 amendment 9: one HTTPS origin (web + /v1 + tiles) for phones on the LAN. Needs the api profile and
  # `next start` on the host (port 3000), built with NEXT_PUBLIC_API_BASE= (empty: same origin).
  proxy:
    profiles: ["web"]
    image: caddy:2.10.2
    container_name: athlete-proxy
    ports:
      - "443:443"
      - "80:80"
    environment:
      - LAN_HOST=${LAN_HOST:-localhost}
    volumes:
      - ./engine/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    restart: "no"
