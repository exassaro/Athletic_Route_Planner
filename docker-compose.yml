# Phase 2 services. Valhalla starts by default; Photon sits
# under the `geocode` profile so it only uses RAM when asked for.
services:
  valhalla:
    # Pinned by digest (was :latest on 2026-11-16, Valhalla 3.9.2) so the engine
    # cannot change under the measurements.
    image: ghcr.io/valhalla/valhalla-scripted@sha256:6e3a8a6deb570f111ab628826f0ffc5c59ea428d3c578d303dce07638c180843
    container_name: athlete-valhalla
    ports:
      - "8002:8002"
    volumes:
      # Tiles, elevation and valhalla.json are written here (gitignored).
      - ./data/valhalla:/custom_files
      # The pinned extract from engine/scripts/fetch_extract.py, read-only.
      - ./data/osm/kerala.osm.pbf:/custom_files/kerala.osm.pbf:ro
    environment:
      - use_tiles_ignore_pbf=True   # reuse built tiles on restart
      - force_rebuild=False
      - build_elevation=True        # download DEM tiles for the graph's bbox
      - build_admins=False          # not needed for pedestrian routing in one country
      - build_time_zones=False      # no time-dependent routing in Phase 2
      - build_tar=True
      - serve_tiles=True
      - server_threads=2            # 8 GB laptop
    restart: "no"

  # Geocoder. Started only on request:  docker compose --profile geocode up -d photon
  photon:
    profiles: ["geocode"]
    build:
      context: ./engine/photon
    image: athlete-photon:1.3.0
    container_name: athlete-photon
    ports:
      - "2322:2322"
    volumes:
      # Prebuilt India index from engine/scripts/fetch_photon.py (gitignored).
      - ./data/photon:/photon
    environment:
      - JAVA_OPTS=-Xmx1500m
    mem_limit: 3g
    restart: "no"

  # GraphHopper: the route generator for the "recommended" alternative (Phase 3 amendment 1), on the same
  # pinned extract as Valhalla. Profile foot_rules plus the Phase 3 spike profiles (foot_direct, foot_quiet).
  # First start imports Kerala (about 3 minutes, about 2 GB RAM); delete data/graphhopper/graph-cache to re-import.
  #   docker compose up -d valhalla graphhopper
  graphhopper:
    build:
      context: ./engine/graphhopper
    image: athlete-graphhopper:11.1
    container_name: athlete-graphhopper
    ports:
      - "8989:8989"
    volumes:
      - ./data/graphhopper:/data
      - ./data/osm/kerala.osm.pbf:/osm/kerala.osm.pbf:ro
    environment:
      - JAVA_OPTS=-Xmx3g
    mem_limit: 4g
    restart: "no"
