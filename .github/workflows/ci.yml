# Checks that need no services (blueprint Phase 5 amendment 2). Engines, Postgres and the live stack are tested
# on the development laptop (pytest tests/api, -m integration, Playwright).
name: ci

on:
  push:
  pull_request:

jobs:
  api-schema-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # The front end's copy of the API schema must match the API (fails when the API changed without it).
      - run: uv run python api/scripts/export_openapi.py --check
      - run: uv run pytest tests/unit -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The generated types must match openapi.json (fails when someone forgot npm run gen:api).
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
