[project]
name = "athlete-router"
version = "0.1.0"
description = "Distance-budgeted running route planner (Phase 2: routing engine experiments)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyproj>=3.6",
    "shapely>=2.0",
    "osmium>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/athlete_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Valhalla at VALHALLA_URL (default http://localhost:8002)",
]
